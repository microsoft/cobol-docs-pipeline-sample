parameters:
- name: cobolRef
  displayName: COBOL repository ref
  type: string
  default: refs/heads/main
- name: cobolSourceGlob
  displayName: COBOL source glob relative to the external repository
  type: string
  default: COBOL/*.CBL

trigger:
  branches:
    include:
    - main
    - develop
  paths:
    exclude:
    - docs/**
    - logs/**
    - temp/**

pr:
  branches:
    include:
    - main
    - develop

resources:
  repositories:
  - repository: cobolSources
    type: git
    # Replace with the Azure DevOps Project/Repository containing the COBOL sources.
    name: MainframeProject/CobolSources
    ref: ${{ parameters.cobolRef }}
    trigger:
    - main

pool:
  vmImage: windows-latest

variables:
  projectRoot: $(Pipeline.Workspace)/s/project
  sourceRoot: $(Pipeline.Workspace)/s/cobol-sources
  cobolSourceGlob: ${{ parameters.cobolSourceGlob }}
  throttle: 4
  runWorkspaceXrefPass: true
  docsCopilotThrottle: 10
  docsCopilotAgent: section-doc-writer
  docsCopilotCli: pwsh
  docsCopilotDryRun: true

stages:
- stage: DagBatchABC
  displayName: DAG Batch Pipeline A-B-C
  jobs:
  - job: RunBatch
    displayName: Run chunk -> facts -> chunk-text
    steps:
    - checkout: self
      path: s/project
      workspaceRepo: true
      fetchDepth: 1
      persistCredentials: false
    - checkout: cobolSources
      path: s/cobol-sources
      fetchDepth: 1
      persistCredentials: false

    - task: UsePythonVersion@0
      displayName: Use Python 3.x
      inputs:
        versionSpec: '3.x'

    - powershell: |
        python -m pip install --upgrade pip
        python -m pip install pyyaml jsonschema
      displayName: Install Python dependencies

    - powershell: |
        python scripts/validation/check-dag-integrity.py
        if ($LASTEXITCODE) { exit 1 }
        python scripts/validation/check-phase-order.py
        if ($LASTEXITCODE) { exit 1 }
        python scripts/validation/check-pipeline-dag-paths.py
        if ($LASTEXITCODE) { exit 1 }
        python scripts/validation/sync-glossary.py
        if ($LASTEXITCODE) { exit 1 }
        python scripts/validation/check-glossary-drift.py
        if ($LASTEXITCODE) { exit 1 }
        python -c "import json, yaml, jsonschema; jsonschema.validate(yaml.safe_load(open('config/pipeline-dag.yaml', encoding='utf-8')), json.load(open('config/pipeline-dag.schema.json', encoding='utf-8'))); print('pipeline-dag schema OK')"
        if ($LASTEXITCODE) { exit 1 }
      displayName: Validate pipeline DAG + config

    - powershell: |
        python -m unittest discover -s tests -p "test_*.py" -v
      displayName: Run repository tests

    - powershell: |
        $sourcePattern = Join-Path '$(sourceRoot)' '$(cobolSourceGlob)'
        ./scripts/run-pipeline.ps1 `
          -Paths $sourcePattern `
          -SourceRoot '$(sourceRoot)' `
          -Throttle $(throttle) `
          -ResultsDir '$(Build.ArtifactStagingDirectory)/batch-results' `
          -To C `
          -RunWorkspaceXrefPass:$(runWorkspaceXrefPass)
      displayName: Run DAG steps A-B-C from external repository

    - task: PublishPipelineArtifact@1
      displayName: Publish batch result XML files
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/batch-results'
        artifact: pipeline-batch-results

  - job: LinuxBashSmoke
    displayName: Validate Linux Bash launchers
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      path: s/project
      workspaceRepo: true
      fetchDepth: 1
      persistCredentials: false
    - checkout: cobolSources
      path: s/cobol-sources
      fetchDepth: 1
      persistCredentials: false

    - task: UsePythonVersion@0
      displayName: Use Python 3.x
      inputs:
        versionSpec: '3.x'

    - bash: |
        set -euo pipefail
        python3 -m pip install --upgrade pip
        python3 -m pip install pyyaml jsonschema
      displayName: Install Python dependencies

    - bash: |
        set -euo pipefail
        python3 scripts/tools/generate-bash-launchers.py --check
        find scripts .github/skills -type f -name '*.sh' -print0 |
          xargs -0 -n1 bash -n
      displayName: Validate Bash launcher inventory and syntax

    - bash: |
        set -euo pipefail
        bash scripts/run-pipeline.sh \
          -Paths '$(sourceRoot)/$(cobolSourceGlob)' \
          -SourceRoot '$(sourceRoot)' \
          -ResultsDir '$(projectRoot)/temp-linux' \
          -To C \
          -MaxPhaseRetries 0
      displayName: Run external sources through Bash

- stage: CopilotChunkDocs
  displayName: Copilot Chunk Documentation
  dependsOn: DagBatchABC
  jobs:
  - job: RunCopilotDocs
    displayName: Run threaded Copilot docs orchestrator
    steps:
    - checkout: self
      path: s/project
      workspaceRepo: true
      fetchDepth: 1
      persistCredentials: false
    - checkout: cobolSources
      path: s/cobol-sources
      fetchDepth: 1
      persistCredentials: false

    - task: UsePythonVersion@0
      displayName: Use Python 3.x
      inputs:
        versionSpec: '3.x'

    - powershell: |
        python -m pip install --upgrade pip
        python -m pip install pyyaml jsonschema
      displayName: Install Python dependencies

    - powershell: |
        $sourcePattern = Join-Path '$(sourceRoot)' '$(cobolSourceGlob)'
        ./scripts/run-pipeline.ps1 `
          -Paths $sourcePattern `
          -SourceRoot '$(sourceRoot)' `
          -Throttle $(throttle) `
          -ResultsDir '$(projectRoot)/temp/copilot-prerequisites' `
          -To C `
          -MaxPhaseRetries 3
      displayName: Prepare deterministic inputs A-B-C

    - powershell: |
        $sourcePattern = Join-Path '$(sourceRoot)' '$(cobolSourceGlob)'
        ./scripts/dispatchers/run-docs-copilot-batch.ps1 `
          -Paths $sourcePattern `
          -SourceRoot '$(sourceRoot)' `
          -EnsureBundles `
          -Agent '$(docsCopilotAgent)' `
          -CopilotCli '$(docsCopilotCli)' `
          -Throttle $(docsCopilotThrottle) `
          -ResultsXml '$(projectRoot)/temp/copilot_doc_results.xml' `
          -Force `
          -DryRun:$(docsCopilotDryRun)
      displayName: Run Copilot per-chunk orchestrator

    - task: PublishPipelineArtifact@1
      displayName: Publish Copilot docs batch results
      inputs:
        targetPath: '$(projectRoot)/temp/copilot_doc_results.xml'
        artifact: copilot-doc-results

- stage: DocumentationPortal
  displayName: Build Documentation Website
  dependsOn: CopilotChunkDocs
  jobs:
  - job: BuildPortal
    displayName: Generate static documentation portal
    steps:
    - checkout: self
      path: s/project
      workspaceRepo: true
      fetchDepth: 1
      persistCredentials: false
    - checkout: cobolSources
      path: s/cobol-sources
      fetchDepth: 1
      persistCredentials: false

    - task: UsePythonVersion@0
      displayName: Use Python 3.x
      inputs:
        versionSpec: '3.x'

    - powershell: |
        python -m pip install --upgrade pip
        python -m pip install markdown pymdown-extensions pyyaml jsonschema
      displayName: Install portal build dependencies

    - powershell: |
        python ./scripts/validation/sync-glossary.py
        python ./scripts/validation/check-glossary-drift.py
      displayName: Validate centralized glossary is in sync

    - powershell: |
        python ./scripts/portal/build-portal-static.py --source-root '$(sourceRoot)'
      displayName: Build documentation website

    - task: PublishPipelineArtifact@1
      displayName: Publish documentation website artifact
      inputs:
        targetPath: '$(projectRoot)/docs/_portal/site'
        artifact: documentation-website
