site_name: COBOL Documentation Pipeline
site_description: User documentation for the mainframe and IBM i reverse-engineering pipeline
docs_dir: site-docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    logo: material/graph-outline
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - DAG and execution model: concepts/dag.md
  - Guides:
      - End-to-end examples: guides/examples.md
      - Inspect generated artifacts: guides/artifacts.md
      - Configure sources: guides/configuration.md
      - Run the pipeline: guides/running.md
      - IBM i sample repository: guides/as400-sample.md
      - CI and GitHub Actions: guides/github-actions.md
  - Reference:
      - Phases, artifacts, agents, and skills: reference/pipeline.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js?v=3

plugins:
  - search

validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn
