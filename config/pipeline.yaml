# Shared configuration for the COBOL/CL/JCL reverse-engineering pipeline.
# Validated by config/pipeline.schema.json.
#
# This file tells every agent WHERE the source code lives, WHICH files to
# process, HOW to decode them, WHICH doc profiles to render, and WHICH
# modernization targets to emit artifacts for.

# Absolute path, or path relative to this repository root, containing the
# COBOL/JCL sources. A Windows absolute path must be quoted and should use
# forward slashes, for example: "D:/Customers/Acme/legacy-sources".
# Sources are NEVER copied into this repo; agents read them by reference.
# Pipeline discovery and explicit selectors both apply the include/exclude
# rules below to files located under this root.
# For local testing, you can point this at one of the bundled `repos/` folders.
source_root: "./repos/sample"

# Include / exclude globs (relative to source_root). Evaluated in order.
include:
  - "**/*.cbl"
  - "**/*.cob"
  - "**/*.cblle"
  - "**/*.sqlcblle"
  - "**/*.cl"
  - "**/*.clp"
  - "**/*.clle"
  - "**/*.jcl"
  - "**/*.prc"
  - "**/*.cpy"
  - "**/*.bms"

exclude:
  - "**/archive/**"
  - "**/Backup/**"
  - "**/old/**"
  - "**/backup/**"
  - "**/Copy/**"

  # samples/COBOL/COPY/*.COB are copybooks (despite the .COB extension),
  # not full programs. Exclude them from the main pipeline; they are
  # consumed by reference via copybook_search_paths.

# Per-file encoding override. Keys are globs (relative to source_root).
# Use "auto" to delegate detection to the cobol-chunking skill.
encodings:
  "**/*.cbl": "auto"
  "**/*.cob": "auto"
  "**/*.cblle": "auto"
  "**/*.sqlcblle": "auto"
  "**/*.cl": "auto"
  "**/*.clp": "auto"
  "**/*.clle": "auto"
  "**/*.jcl": "auto"
  "**/*.cpy": "auto"
  "**/*.bms": "auto"
  "**/*.prc": "auto"

# COBOL platform selection. "auto" detects IBM i from member extensions and
# IBM i-specific source constructs while retaining z/OS/mainframe behavior.
# Use `platforms` when one source tree contains both platforms.
platform: "auto"
platforms:
  "**/*.cblle": "ibmi"
  "**/*.sqlcblle": "ibmi"
  "**/*.cl": "ibmi"
  "**/*.clp": "ibmi"
  "**/*.clle": "ibmi"
  "QCPYSRC/**": "ibmi"

# Default doc profiles. Override per-invocation with --profile-fa / --profile-req.
functional_analysis_profile: "default"
requirements_profile: "default"

# Documentation output languages for scripts/run-pipeline.ps1 and .sh.
# Use [it] for Italian only, or [en, it] for English + Italian.
# Override for one run with -Languages en,it, or with a phase language option.
# This is unrelated to modernization.target_languages (java/dotnet).
output:
  languages: [it]
  # Select file AND group outputs for a normal run (omitted keys default to true).
  # Analyses automatically generate their prerequisite docs; group functional
  # analysis also uses requirements. docs controls overview diagrams as well.
  # Any enabled output builds the portal. All false means no work.
  # Explicit -Phases or -From/-To overrides this selection without adding prerequisites.
  # -Skip and legacy Run* switches are applied last. Existing outputs are not deleted.
  generate:
    docs: true
    functional_analysis: true
    requirements: true
    technical_analysis: true

# Copybook search paths (resolved relative to source_root).
copybook_search_paths:
  - "COBOL/COPY"
  - "QCPYSRC"
  - "copybooks"

# Public runners execute phases sequentially, with parallel workers within each stage.
# Copilot concurrency: 1-32; CLI -CopilotThrottle overrides this shared default.
# execution_mode/per_file_parallelism are declarative orchestrator settings;
# neither they nor pipeline-dag.yaml max_parallel control the public runners.
pipeline:
  copilot_parallelism: 16
  execution_mode: "per-file-loop"
  per_file_parallelism: 1

# -CopilotModel overrides this default. Omit default_model to use each agent's
# model frontmatter, then Copilot automatic selection. Use CLI model IDs here.
copilot:
  default_model: "claude-sonnet-4.5"

# Modernization configuration — drives the file/group modernizer agents and
# the cobol-to-target-mapping skill.
modernization:
  # One or both of: java, dotnet. Both ship by default.
  target_languages:
    - java
    - dotnet
  # Orchestration target for JCL → modern scheduler conversion.
  # One of: spring-batch | azure-functions | airflow | step-functions
  orchestration_target: "spring-batch"
  # DB target for DB2 SQL → modern DB conversion.
  # One of: postgres | sqlserver | db2 | as-is
  db_target: "postgres"
