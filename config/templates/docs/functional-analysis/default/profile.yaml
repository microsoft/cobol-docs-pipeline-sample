    required: true
    min_paragraphs: 1

  - id: processi-business
    number: "3"
    title: Business processes
    required: true
    min_paragraphs: 1

  - id: elenco-funzionalita
    number: "4"
    title: Functional capabilities
    required: true
    min_paragraphs: 1

  - id: focus-elaborazioni
    number: "5"
    title: Processing rules
    required: false
    optional_marker: "No source-backed processing rules were identified."

  - id: flussi-input
    number: "6"
    title: Input and output flows
    required: false
    optional_marker: "No source-backed input or output flows were identified."

  - id: tipologie-record
    number: "7"
