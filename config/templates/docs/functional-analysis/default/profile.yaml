    required: false
    optional_marker: "No source-backed error-handling behavior was identified."

  - id: profili-protezione-dati
    number: "11"
    title: Security and data protection
    required: false
    optional_marker: "No source-backed security or data-protection controls were identified."

  - id: open-points
    number: "12"
    title: Open points
    required: false
    optional_marker: "No source-backed open points were identified."

footer:
  text: "Generated from source-backed pipeline evidence."
