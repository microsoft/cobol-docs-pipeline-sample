name: COBOL documentation CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "logs/**"
      - "temp/**"
  pull_request:
    branches:
      - main
      - develop
  repository_dispatch:
    types:
      - cobol-sources-updated
  workflow_dispatch:
    inputs:
      cobol_repository:
        description: External COBOL repository in owner/name format
        required: false
        type: string
      cobol_ref:
        description: Branch, tag, or SHA in the COBOL repository
        required: false
        default: main
        type: string
      cobol_source_glob:
        description: Source glob relative to the external repository
        required: false
        default: COBOL/*.CBL
        type: string
      max_phase_retries:
        description: Maximum retries after a phase failure
        required: false
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COBOL_REPOSITORY: ${{ github.event.client_payload.cobol_repository || inputs.cobol_repository || vars.COBOL_REPOSITORY || 'your-org/your-cobol-repository' }}
  COBOL_REF: ${{ github.event.client_payload.cobol_ref || inputs.cobol_ref || vars.COBOL_REF || 'main' }}
  COBOL_SOURCE_GLOB: ${{ github.event.client_payload.cobol_source_glob || inputs.cobol_source_glob || vars.COBOL_SOURCE_GLOB || 'COBOL/*.CBL' }}
  SOURCE_ROOT: repos/external
  MAX_PHASE_RETRIES: ${{ inputs.max_phase_retries || '3' }}

jobs:
  validate-windows:
    name: Validate and run A-C on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out COBOL sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.COBOL_REPOSITORY }}
          ref: ${{ env.COBOL_REF }}
          token: ${{ secrets.COBOL_REPOSITORY_TOKEN || github.token }}
          path: repos/external
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml jsonschema

      - name: Validate configuration
        shell: pwsh
        run: |
          python scripts/validation/check-dag-integrity.py
          python scripts/validation/check-phase-order.py
          python scripts/validation/check-pipeline-dag-paths.py
          python scripts/validation/sync-glossary.py
          python scripts/validation/check-glossary-drift.py
          python -c "import json, yaml, jsonschema; jsonschema.validate(yaml.safe_load(open('config/pipeline-dag.yaml', encoding='utf-8')), json.load(open('config/pipeline-dag.schema.json', encoding='utf-8'))); print('pipeline-dag schema OK')"

      - name: Run tests
        run: python -m pytest -q

      - name: Run deterministic phases A-C
        shell: pwsh
        run: |
          ./scripts/run-pipeline.ps1 `
            -Paths "$env:SOURCE_ROOT/$env:COBOL_SOURCE_GLOB" `
            -SourceRoot $env:SOURCE_ROOT `
            -Throttle 4 `
            -ResultsDir temp/ci-windows `
            -To C `
            -MaxPhaseRetries $env:MAX_PHASE_RETRIES

      - name: Upload Windows results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-pipeline-results
          path: temp/ci-windows
          if-no-files-found: warn
          retention-days: 14

  validate-linux:
    name: Validate Bash and run A-C on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out COBOL sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.COBOL_REPOSITORY }}
          ref: ${{ env.COBOL_REF }}
          token: ${{ secrets.COBOL_REPOSITORY_TOKEN || github.token }}
          path: repos/external
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Validate co-located Bash launchers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tools/generate-bash-launchers.py --check
          find scripts .github/skills -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n

      - name: Run deterministic phases A-C through Bash
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-pipeline.sh \
            -Paths "${SOURCE_ROOT}/${COBOL_SOURCE_GLOB}" \
            -SourceRoot "${SOURCE_ROOT}" \
            -Throttle 4 \
            -ResultsDir temp/ci-linux \
            -To C \
            -MaxPhaseRetries "${MAX_PHASE_RETRIES}"

      - name: Upload Linux results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-pipeline-results
          path: temp/ci-linux
          if-no-files-found: warn
          retention-days: 14

  copilot-dry-run:
    name: Exercise Copilot dispatcher in dry-run mode
    runs-on: windows-latest
    needs: validate-windows
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out COBOL sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.COBOL_REPOSITORY }}
          ref: ${{ env.COBOL_REF }}
          token: ${{ secrets.COBOL_REPOSITORY_TOKEN || github.token }}
          path: repos/external
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dispatcher dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Prepare deterministic inputs
        shell: pwsh
        run: |
          ./scripts/run-pipeline.ps1 `
            -Paths "$env:SOURCE_ROOT/$env:COBOL_SOURCE_GLOB" `
            -SourceRoot $env:SOURCE_ROOT `
            -Throttle 4 `
            -ResultsDir temp/ci-copilot `
            -To C `
            -MaxPhaseRetries $env:MAX_PHASE_RETRIES

      - name: Build Copilot dispatch commands
        shell: pwsh
        run: |
          ./scripts/dispatchers/run-docs-copilot-batch.ps1 `
            -Paths "$env:SOURCE_ROOT/$env:COBOL_SOURCE_GLOB" `
            -SourceRoot $env:SOURCE_ROOT `
            -EnsureBundles `
            -Agent section-doc-writer `
            -CopilotCli pwsh `
            -Throttle 4 `
            -ResultsXml temp/ci-copilot/copilot_doc_results.xml `
            -Force `
            -DryRun

      - name: Upload Copilot dry-run results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-dry-run-results
          path: temp/ci-copilot
          if-no-files-found: warn
          retention-days: 14

  build-portal:
    name: Build documentation portal
    runs-on: ubuntu-latest
    needs:
      - validate-windows
      - validate-linux
      - copilot-dry-run
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out COBOL sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.COBOL_REPOSITORY }}
          ref: ${{ env.COBOL_REF }}
          token: ${{ secrets.COBOL_REPOSITORY_TOKEN || github.token }}
          path: repos/external
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install portal dependencies
        run: python3 -m pip install --disable-pip-version-check markdown pymdown-extensions pyyaml jsonschema

      - name: Build portal
        run: |
          python3 scripts/validation/sync-glossary.py
          python3 scripts/validation/check-glossary-drift.py
          python3 scripts/portal/build-portal-static.py --source-root "${SOURCE_ROOT}"

      - name: Upload documentation portal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-website
          path: docs/_portal/site
          if-no-files-found: error
          retention-days: 14
